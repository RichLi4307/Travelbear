# 景区围栏 + 景区内点位。改地点只改这个文件，不动代码。
#
# ══════════════════════════════════════════════════════════════════════════
# 坐标全部是 WGS84（和 GNSS 模块输出一致）。
#
# 下面 5 个景区的**景区中心坐标**来自 OpenStreetMap（Overpass API），是标准
# WGS84；静安寺还用 maps4gis 的 WGS-84 值和「高德 GCJ-02 反推」交叉验证过，
# 三者吻合在 200m 内。景区半径大，这个精度**可以直接用**。
#
# 但 **点位（spots）的坐标必须到现场实测** —— 点位半径只有 40~80m，
# 网上抄来的坐标差 200m 就永远进不了圈。标了 [待实测] 的都只是占位值。
#
# 实测方法（站在目标点别动）：
#     python tools/nmea_recorder.py --port COM3 --pick
# 它会采样 20s 取中位数，直接打印能粘进本文件的坐标。
#
# 调半径的实时工具（边走边看判定结果）：
#     python tools/where_am_i.py --port COM3
#
# 如果你从高德/腾讯坐标拾取器复制坐标，那是 GCJ-02（火星坐标），在中国境内
# 和 WGS84 相差 300~600m。给该条目加一行 coord: gcj02，加载时会自动折算。
# ══════════════════════════════════════════════════════════════════════════
#
# 半径怎么定：
#   景区 radius_m = 从中心到景区最远边界的距离
#   点位 radius_m = 你希望"站多近才算到了这个点"，一般 40~80m
#                   太小 → 走到跟前也不触发；太大 → 相邻点位抢话

areas:

  # ─────────────────────────────────────────────── 1. 外滩
  # 外滩是沿黄浦江的**带状**区域：南到十六铺码头，北到外白渡桥，直线约 1.57km。
  # 圆心取这两个端点的中点，半径 900m 正好把两端都罩住（各距圆心约 786m）。
  #
  # ⚠️ 这里暴露了圆形围栏的天然局限：半径 900m 会跨过黄浦江，
  #    所以站在陆家嘴一侧也会被判成"外滩"。演示在江这边跑，不影响；
  #    真要精确得用多边形围栏（单人版明确不做）。
  #
  # 圆心是**从两个端点点位反推**的，不是随手取的 —— 所以下面每个点位都在圈内。
  # 改点位坐标后，务必跑 pytest tests/test_config_files.py 复查这一条。
  - name: "外滩"
    lat: 31.238340
    lon: 121.488720
    radius_m: 900
    coord: wgs84
    spots:
      - name: "外白渡桥"
        lat: 31.244865   # 高德POI「外白渡桥」折算，原始GCJ02 121.490060,31.242896
        lon: 121.485576
        radius_m: 60
      - name: "陈毅广场（南京东路口）"
        lat: 31.240964   # 高德POI「外滩-陈毅广场」折算，原始GCJ02 121.490390,31.238992
        lon: 121.485907
        radius_m: 60
      - name: "十六铺码头（延安东路口）"
        lat: 31.231805   # 高德POI「十六铺码头-景观平台」折算，原始GCJ02 121.496333,31.229811
        lon: 121.491872
        radius_m: 60

  # ─────────────────────────────────────────────── 2. 静安寺
  # 中心 = 静安寺寺庙本体（南京西路1686号）的几何中心，OSM 实测值。
  # 交叉验证：maps4gis 给 31.22689/121.43887；用高德 GCJ-02 值反推得
  #           31.2254/121.4407 —— 与 OSM 的 31.22541/121.44073 吻合到米级。
  - name: "静安寺"
    lat: 31.225410
    lon: 121.440730
    radius_m: 400
    coord: wgs84
    spots:
      - name: "静安寺山门"
        lat: 31.224914   # 高德POI「静安寺-山门」折算，原始GCJ02 121.445565,31.223043
        lon: 121.440954
        radius_m: 40
      - name: "静安公园"
        lat: 31.223909   # 高德POI「静安公园」折算，原始GCJ02 121.446873,31.222035
        lon: 121.442265
        radius_m: 50

  # ─────────────────────────────────────────────── 3. 松江广富林
  # 中心 = 广富林遗址文化公园（leisure=nature_reserve）多边形的中心，OSM 实测值。
  - name: "广富林遗址文化公园"
    lat: 31.064150
    lon: 121.193130
    radius_m: 800
    coord: wgs84
    spots:
      - name: "广富林遗址本体"
        lat: 31.064728   # 高德POI「上海广富林文化遗址」折算，原始GCJ02 121.196269,31.062675
        lon: 121.191799
        radius_m: 80
      # 需要更多点位时照抄这段，坐标用 --pick 实测：
      # - name: "广富林文化展示馆"
      #   lat: 0.0
      #   lon: 0.0
      #   radius_m: 60

  # ─────────────────────────────────────────────── 4. 滴水湖
  # 滴水湖是标准圆形，直径约 2.5km。中心由「滴水湖地铁站（OSM 30.9093/121.9258）
  # 位于湖的西北岸、湖半径约 1.25km」反推得到。→ 首次去现场务必用 where_am_i.py 复核。
  - name: "滴水湖"
    lat: 30.901000
    lon: 121.935000
    radius_m: 1500
    coord: wgs84
    spots:
      - name: "滴水湖地铁站"
        lat: 30.909541   # 高德POI「滴水湖地铁站1号口」折算，原始GCJ02 121.930530,30.907178
        lon: 121.926443
        radius_m: 120
      # - name: "环湖西一路观景平台"
      #   lat: 0.0
      #   lon: 0.0
      #   radius_m: 80

  # ─────────────────────────────────────────────── 5. 上海大学（宝山校区）
  # 圆心是估算值，但已用高德逆地理编码核验：返回「上海大学宝山校区W楼」，
  # 说明落点在校园内。校园约 1.9km × 1.3km，半径 1100m 够用。
  # 想更准可以拿模块站在校园几何中心跑一次 nmea_recorder.py --pick。
  - name: "上海大学（宝山校区）"
    lat: 31.320000
    lon: 121.388000
    radius_m: 1100
    coord: wgs84
    spots:
      - name: "上海大学地铁站"
        lat: 31.322676   # 高德POI「上海大学地铁站1号口」折算，原始GCJ02 121.389267,31.320873
        lon: 121.384615
        radius_m: 80
      - name: "上海大学校医院"
        lat: 31.321809   # 高德POI「上海大学校医院停车场(出入口)」折算，原始GCJ02 121.388117,31.320004
        lon: 121.383466
        radius_m: 60
      # - name: "泮池"
      #   lat: 0.0
      #   lon: 0.0
      #   radius_m: 50
